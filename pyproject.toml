[project]
name = "faq-chatbot-demo"
version = "0.1.0"
description = "Document-grounded FAQ chatbot demo for portfolio"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
